name: Build and publish Rallly

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rallly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            SELF_HOSTED=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Déployer Rallly sur la VM
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, rallly-deplloy]
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Vérifier la configuration
        run: sudo -n /opt/RalllyDevDocker/deploy-vm.sh config --quiet

      - name: Télécharger la nouvelle image
        run: sudo -n /opt/RalllyDevDocker/deploy-vm.sh pull rallly-web

      - name: Mettre à jour Rallly et attendre son état de santé
        run: |
          sudo -n /opt/RalllyDevDocker/deploy-vm.sh up \
            -d --no-build --no-deps \
            --wait --wait-timeout 180 rallly-web

      - name: Afficher les services
        if: always()
        run: sudo -n /opt/RalllyDevDocker/deploy-vm.sh ps

      - name: Afficher les journaux en cas d’échec
        if: failure()
        run: sudo -n /opt/RalllyDevDocker/deploy-vm.sh logs --tail=100 rallly-web
